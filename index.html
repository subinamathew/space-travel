<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Hello Worlds — Solar System Tour</title>
    <meta name="description" content="Tour the solar system — click any planet to visit!" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --glow: #4a90d9
        }

        html,
        body {
            height: 100%;
            font-family: Outfit, system-ui, sans-serif;
            background: #020510;
            color: #fff;
            overflow: hidden
        }

        #stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none
        }

        /* ---- VIEWS ---- */
        #solar-system {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity .5s ease
        }

        #solar-system.fade-out {
            opacity: 0;
            pointer-events: none
        }

        #planet-view {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            opacity: 0;
            pointer-events: none;
            transform: scale(1.04);
            transition: opacity .5s ease, transform .5s ease, background .6s ease
        }

        #planet-view.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1)
        }

        /* ---- ORRERY ---- */
        #scene {
            position: relative;
            width: min(100vw, 100vh);
            height: min(100vw, 100vh);
            overflow: visible
        }

        #sun {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 5.5vmin;
            height: 5.5vmin;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #fff5aa, #ffcc00 40%, #ff8800);
            box-shadow: 0 0 18px 6px rgba(255, 200, 0, .75), 0 0 50px 18px rgba(255, 140, 0, .45), 0 0 100px 35px rgba(255, 100, 0, .18);
            z-index: 10
        }

        /* CSS orbit animation — pure CSS, no JS timers */
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .07);
            animation: orbit-spin 10s linear 0s infinite;
            overflow: visible
        }

        @keyframes orbit-spin {
            to {
                transform: rotate(360deg)
            }
        }

        .planet-btn {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            color: inherit;
            cursor: pointer;
            outline: none;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            animation: counter-spin 10s linear 0s infinite
        }

        @keyframes counter-spin {
            from {
                transform: translate(-50%, -50%) rotate(0deg)
            }

            to {
                transform: translate(-50%, -50%) rotate(-360deg)
            }
        }

        .planet-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .planet-sphere {
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, var(--pc1), var(--pc2));
            box-shadow: 0 0 8px var(--pglow);
            transition: box-shadow .25s, transform .25s;
            position: relative;
            z-index: 1
        }

        .planet-btn:hover .planet-sphere,
        .planet-btn:focus-visible .planet-sphere {
            box-shadow: 0 0 22px var(--pglow), 0 0 44px var(--pglow);
            transform: scale(1.4)
        }

        .home-ring {
            position: absolute;
            border-radius: 50%;
            border: 1.5px solid rgba(200, 160, 90, .65);
            transform: rotateX(70deg);
            pointer-events: none;
            z-index: 0
        }

        .planet-label {
            font-size: clamp(.42rem, .75vmin, .62rem);
            font-weight: 600;
            letter-spacing: .07em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .4);
            white-space: nowrap;
            transition: color .2s;
            font-family: Outfit, system-ui, sans-serif
        }

        .planet-btn:hover .planet-label {
            color: rgba(255, 255, 255, .9)
        }

        /* ---- BACK BUTTON ---- */
        #back-btn {
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .15);
            color: #fff;
            font-family: Outfit, system-ui, sans-serif;
            font-size: .85rem;
            font-weight: 600;
            letter-spacing: .06em;
            padding: .45rem 1.1rem;
            border-radius: 999px;
            cursor: pointer;
            outline: none;
            position: fixed;
            top: 1.4rem;
            left: 1.4rem;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px);
            transition: opacity .4s ease, transform .4s ease, background .2s, box-shadow .2s;
            backdrop-filter: blur(10px)
        }

        #back-btn.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0)
        }

        #back-btn:hover {
            background: rgba(255, 255, 255, .18);
            box-shadow: 0 0 20px var(--glow)
        }

        /* ---- PLANET DETAIL ---- */
        #pv-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem
        }

        #pv-planet {
            border-radius: 50%;
            animation: spin 18s linear infinite;
            background: radial-gradient(circle at 35% 35%, var(--c1, #4a90d9), var(--c2, #1a3a6a));
            box-shadow: 0 0 60px var(--glow, #4a90d9), inset -30px -20px 40px rgba(0, 0, 0, .5);
            transition: width .6s ease, height .6s ease, box-shadow .6s ease
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        #pv-ring {
            position: absolute;
            border-radius: 50%;
            border: 14px solid rgba(200, 160, 90, .55);
            box-shadow: 0 0 18px rgba(200, 160, 90, .35);
            pointer-events: none;
            opacity: 0;
            transform: rotateX(70deg);
            transition: opacity .4s ease .2s
        }

        #pv-ring.visible {
            opacity: 1
        }

        #pv-card {
            text-align: center;
            max-width: 500px;
            width: 100%
        }

        #pv-greeting {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 800;
            letter-spacing: -.02em;
            line-height: 1.15;
            color: #fff;
            animation: pop .5s ease both
        }

        #pv-name {
            font-size: .85rem;
            font-weight: 600;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--glow);
            margin: .5rem 0 .9rem;
            opacity: .85;
            transition: color .6s ease;
            animation: pop .5s .1s ease both
        }

        #pv-fact {
            font-size: .95rem;
            font-weight: 300;
            line-height: 1.7;
            color: rgba(255, 255, 255, .72);
            animation: pop .5s .2s ease both
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(14px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        #pv-nav {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            align-items: center
        }

        .nav-btn {
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .15);
            color: #fff;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            outline: none;
            transition: background .25s, transform .2s, box-shadow .25s;
            backdrop-filter: blur(10px)
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, .18);
            transform: scale(1.1);
            box-shadow: 0 0 20px var(--glow)
        }

        .nav-btn:active {
            transform: scale(.95)
        }

        #pv-counter {
            font-size: .8rem;
            font-weight: 600;
            letter-spacing: .12em;
            color: rgba(255, 255, 255, .4);
            min-width: 50px;
            text-align: center
        }

        #pv-dots {
            display: flex;
            gap: 8px;
            margin-top: 1.5rem;
            flex-wrap: wrap;
            justify-content: center
        }

        .dot {
            background: rgba(255, 255, 255, .25);
            border: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            cursor: pointer;
            outline: none;
            transition: background .3s, transform .3s
        }

        .dot.active {
            background: var(--glow);
            transform: scale(1.5);
            box-shadow: 0 0 8px var(--glow)
        }

        #hint {
            position: fixed;
            bottom: .8rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: .7rem;
            letter-spacing: .1em;
            color: rgba(255, 255, 255, .2);
            pointer-events: none;
            font-family: Outfit, system-ui, sans-serif;
            transition: opacity .4s ease
        }
    </style>
</head>

<body>
    <canvas id="stars"></canvas>
    <div id="solar-system">
        <div id="scene">
            <div id="sun"></div>
        </div>
    </div>
    <div id="planet-view">
        <div id="pv-wrap">
            <div id="pv-ring"></div>
            <div id="pv-planet"></div>
        </div>
        <div id="pv-card">
            <h1 id="pv-greeting"></h1>
            <p id="pv-name"></p>
            <p id="pv-fact"></p>
        </div>
        <div id="pv-nav">
            <button class="nav-btn" id="btn-prev" aria-label="Previous planet">←</button>
            <span id="pv-counter"></span>
            <button class="nav-btn" id="btn-next" aria-label="Next planet">→</button>
        </div>
        <div id="pv-dots" role="tablist" aria-label="Planet selector"></div>
    </div>
    <button id="back-btn" aria-label="Back to solar system">← Solar System</button>
    <p id="hint">Click a planet to visit &nbsp;&bull;&nbsp; ←→ to browse when visiting</p>
    <script>
        const planets = [
            { name: 'Mercury', greeting: 'Hello, Scorched World!', fact: 'The smallest planet — a day lasts longer than a year, with temperatures ranging from −180°C to 430°C.', c1: '#b8a99a', c2: '#5c4a3d', glow: '#d4a574', bg: 'radial-gradient(ellipse at 60% 20%, #1a0f08 0%, #020510 70%)', orbitR: 9, size: 0.9, dur: '3s', delay: '0s', pvSize: 110 },
            { name: 'Venus', greeting: 'Hello, Inferno Twin!', fact: 'A runaway greenhouse makes Venus the hottest planet at 465°C — hotter than Mercury despite being farther from the Sun.', c1: '#f5c842', c2: '#8b5e00', glow: '#f5c842', bg: 'radial-gradient(ellipse at 60% 20%, #1a1200 0%, #020510 70%)', orbitR: 13, size: 1.5, dur: '5s', delay: '-1.875s', pvSize: 150 },
            { name: 'Earth', greeting: 'Hello, Home!', fact: 'The only known world teeming with life. Our pale blue dot is 71% ocean, wrapped in a life-giving atmosphere.', c1: '#4a90d9', c2: '#1a3a6a', glow: '#4a90d9', bg: 'radial-gradient(ellipse at 60% 20%, #020d1a 0%, #020510 70%)', orbitR: 17.5, size: 1.6, dur: '7s', delay: '-3.5s', pvSize: 158 },
            { name: 'Mars', greeting: 'Hello, Red Planet!', fact: 'Home to Olympus Mons — the tallest volcano in the solar system at 21 km high. The rusty colour is iron-oxide dust.', c1: '#c1440e', c2: '#5c1a00', glow: '#e05a22', bg: 'radial-gradient(ellipse at 60% 20%, #1a0500 0%, #020510 70%)', orbitR: 22.5, size: 1.2, dur: '10s', delay: '-5.5s', pvSize: 128 },
            { name: 'Jupiter', greeting: 'Hello, Giant King!', fact: 'So massive all other planets could fit inside it. Its Great Red Spot storm has raged for over 350 years.', c1: '#c89060', c2: '#5c3010', glow: '#c89060', bg: 'radial-gradient(ellipse at 60% 20%, #1a0d00 0%, #020510 70%)', orbitR: 29, size: 2.8, dur: '20s', delay: '-7s', pvSize: 220 },
            { name: 'Saturn', greeting: 'Hello, Ringed Beauty!', fact: 'Saturn’s iconic rings span 282,000 km. It’s so low-density it would float on water!', c1: '#e0c080', c2: '#7a5a20', glow: '#e0c080', bg: 'radial-gradient(ellipse at 60% 20%, #1a1500 0%, #020510 70%)', orbitR: 36.5, size: 2.3, dur: '30s', delay: '-12s', hasRing: true, pvSize: 195 },
            { name: 'Uranus', greeting: 'Hello, Ice Giant!', fact: 'Uranus has a 98° axial tilt — it rolls around the Sun on its side. Its blue-green hue comes from methane gas.', c1: '#7de8e8', c2: '#1a6060', glow: '#7de8e8', bg: 'radial-gradient(ellipse at 60% 20%, #001a1a 0%, #020510 70%)', orbitR: 42.5, size: 1.9, dur: '42s', delay: '-25s', pvSize: 172 },
            { name: 'Neptune', greeting: 'Hello, Windy World!', fact: 'The windiest planet — storms reach 2,100 km/h. One orbit of the Sun takes 165 Earth years.', c1: '#3b6fcc', c2: '#0a1a5c', glow: '#5588ff', bg: 'radial-gradient(ellipse at 60% 20%, #000a1a 0%, #020510 70%)', orbitR: 48, size: 1.8, dur: '60s', delay: '-10s', pvSize: 162 },
        ];
        // Build orrery orbits in DOM (data-driven from planets array)
        const scene = document.getElementById("scene");
        planets.forEach((p, i) => {
            const o = document.createElement("div");
            o.className = "orbit";
            const r = p.orbitR;
            o.style.width = (r * 2) + "vmin"; o.style.height = (r * 2) + "vmin";
            o.style.marginTop = "-" + r + "vmin"; o.style.marginLeft = "-" + r + "vmin";
            o.style.animationDuration = p.dur; o.style.animationDelay = p.delay;
            const b = document.createElement("button");
            b.className = "planet-btn";
            b.style.setProperty("--pc1", p.c1); b.style.setProperty("--pc2", p.c2); b.style.setProperty("--pglow", p.glow);
            b.style.animationDuration = p.dur; b.style.animationDelay = p.delay;
            b.setAttribute("aria-label", "Visit " + p.name); b.title = p.name;
            b.addEventListener("click", () => showPlanet(i));
            const w = document.createElement("div"); w.className = "planet-wrap";
            if (p.hasRing) {
                const rng = document.createElement("div"); rng.className = "home-ring";
                rng.style.width = (p.size * 2.1) + "vmin"; rng.style.height = (p.size * .42) + "vmin";
                w.appendChild(rng);
            }
            const s = document.createElement("div"); s.className = "planet-sphere";
            s.style.width = p.size + "vmin"; s.style.height = p.size + "vmin";
            w.appendChild(s); b.appendChild(w);
            const lbl = document.createElement("span"); lbl.className = "planet-label"; lbl.textContent = p.name;
            b.appendChild(lbl); o.appendChild(b); scene.appendChild(o);
        });
        // View state
        let cur = 2;
        const solarEl = document.getElementById("solar-system"), pvEl = document.getElementById("planet-view"), backBtn = document.getElementById("back-btn");
        const pvPlanet = document.getElementById("pv-planet"), pvRing = document.getElementById("pv-ring"), pvGreeting = document.getElementById("pv-greeting");
        const pvName = document.getElementById("pv-name"), pvFact = document.getElementById("pv-fact"), pvCounter = document.getElementById("pv-counter");
        const pvDotsEl = document.getElementById("pv-dots"), hintEl = document.getElementById("hint"), root = document.documentElement;
        planets.forEach((p, i) => {
            const b = document.createElement("button"); b.className = "dot";
            b.setAttribute("aria-label", p.name); b.setAttribute("role", "tab"); b.title = p.name;
            b.addEventListener("click", () => goTo(i)); pvDotsEl.appendChild(b);
        });
        const dots = pvDotsEl.querySelectorAll(".dot");
        function renderPlanet(idx) {
            const p = planets[idx];
            root.style.setProperty("--c1", p.c1); root.style.setProperty("--c2", p.c2); root.style.setProperty("--glow", p.glow);
            pvEl.style.background = p.bg;
            pvPlanet.style.width = p.pvSize + "px"; pvPlanet.style.height = p.pvSize + "px";
            pvRing.classList.toggle("visible", !!p.hasRing);
            if (p.hasRing) { pvRing.style.width = (p.pvSize * 1.6) + "px"; pvRing.style.height = (p.pvSize * .32) + "px"; }
            [pvGreeting, pvName, pvFact].forEach(el => { el.style.animation = "none"; void el.offsetHeight; el.style.animation = ""; });
            pvGreeting.textContent = p.greeting;
            pvName.textContent = "— " + p.name + " —";
            pvFact.textContent = p.fact;
            pvCounter.textContent = (idx + 1) + " / " + planets.length;
            dots.forEach((d, i) => d.classList.toggle("active", i === idx));
        }
        function showPlanet(idx) {
            cur = idx; renderPlanet(cur);
            solarEl.classList.add("fade-out"); pvEl.classList.add("active"); backBtn.classList.add("visible");
            hintEl.style.opacity = "0";
        }
        function showHome() {
            solarEl.classList.remove("fade-out"); pvEl.classList.remove("active"); backBtn.classList.remove("visible");
            hintEl.style.opacity = "";
        }
        function goTo(idx) { cur = ((idx % planets.length) + planets.length) % planets.length; renderPlanet(cur); }
        backBtn.addEventListener("click", showHome);
        document.getElementById("btn-prev").addEventListener("click", () => goTo(cur - 1));
        document.getElementById("btn-next").addEventListener("click", () => goTo(cur + 1));
        document.addEventListener("keydown", e => {
            if (pvEl.classList.contains("active")) {
                if (e.key === "ArrowRight") goTo(cur + 1);
                if (e.key === "ArrowLeft") goTo(cur - 1);
                if (e.key === "Escape") showHome();
            }
        });
        // Twinkling starfield (canvas)
        (function () {
            const canvas = document.getElementById("stars"), ctx = canvas.getContext("2d"); let stars = [];
            function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
            function mkStars() { stars = Array.from({ length: 260 }, () => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.3 + .2, op: Math.random() * .6 + .1, speed: Math.random() * .5 + .1, phase: Math.random() * Math.PI * 2 })); }
            let t = 0;
            function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); t += .012; stars.forEach(s => { ctx.globalAlpha = s.op * (.5 + .5 * Math.sin(t * s.speed + s.phase)); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }); requestAnimationFrame(draw); }
            window.addEventListener("resize", () => { resize(); mkStars(); });
            resize(); mkStars(); draw();
        })();
    </script>
</body>

</html>
