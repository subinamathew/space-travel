<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .badge { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
    .name-title { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 21px; font-weight: 800; fill: url(#textGrad); letter-spacing: -0.3px; }
    .label { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; }
    .value { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; font-weight: 500; fill: #f1f5f9; }
    .highlight { font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace; font-size: 14.5px; font-weight: 600; fill: #38bdf8; }
    .domain-tag { font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #f59e0b; }
  </style>

  <!-- Card Background -->
  <rect x="12" y="12" width="696" height="256" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" filter="url(#cardGlow)" />

  <!-- Top Accent Pip -->
  <circle cx="36" cy="38" r="4" fill="#38bdf8" />
  <circle cx="50" cy="38" r="4" fill="#818cf8" />
  <circle cx="64" cy="38" r="4" fill="#34d399" />

  <!-- Badge / Header -->
  <text x="82" y="42" class="badge">ANGABEN GEMÄSS § 5 DDG • DOMAIN INHABER &amp; BETREIBER</text>
  <text x="684" y="42" text-anchor="end" class="domain-tag">rocketrun.de</text>

  <!-- Divider Line -->
  <line x1="36" y1="56" x2="684" y2="56" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Domain Owner Name -->
  <text x="36" y="86" class="label">Domain-Inhaber &amp; Verantwortlicher:</text>
  <text x="36" y="114" class="name-title">Abraham Mathew Kizhuvallil Puthen Purayil</text>

  <!-- Column 1: Address -->
  <g transform="translate(36, 142)">
    <text x="0" y="0" class="label">Postanschrift / Postal Address:</text>
    <text x="0" y="24" class="value">193 Little Lullaway</text>
    <text x="0" y="46" class="value">Basildon, Essex, SS15 5JD</text>
    <text x="0" y="68" class="value">United Kingdom (Vereinigtes Königreich)</text>
  </g>

  <!-- Column 2: Electronic Contact -->
  <g transform="translate(380, 142)">
    <text x="0" y="0" class="label">Elektronische Kontaktaufnahme:</text>
    <text x="0" y="24" class="value">E-Mail: <tspan class="highlight">hello@missional.eu</tspan></text>
    <text x="0" y="48" class="label">Gemeinnützige Initiative:</text>
    <text x="0" y="70" class="value">Part of <tspan class="highlight">missional.eu</tspan> (UK Non-Profit)</text>
  </g>
</svg>
